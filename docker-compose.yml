services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: gov_agent
      POSTGRES_USER: gov_agent
      POSTGRES_PASSWORD: gov_agent_dev
    ports:
      - "5432:5432"
    volumes:
      - gov_agent_pgdata:/var/lib/postgresql/data
      - ./database/schema.sql:/docker-entrypoint-initdb.d/001-schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gov_agent -d gov_agent"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  gov_agent_pgdata:
